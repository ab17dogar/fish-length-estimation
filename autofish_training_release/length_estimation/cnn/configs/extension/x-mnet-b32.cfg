# Extension study config (train with ../train_vfm.py, NOT train.py).
# x-mnet-ft: encoder=mobilenet_v2, regime=ft.
[Config]
OUTPUT_DIR: ./output/x-mnet-b32/
MASKS_GT: /workspace/autofish_dataset/annotations.json
TRAIN_GROUPS: [2, 3, 4, 5, 7, 8, 9, 12, 13, 15, 16, 18, 19, 23, 24]
VAL_GROUPS: [1, 6, 11, 17, 25]
TEST_GROUPS: [10, 14, 20, 21, 22]

[Training]
CACHE_IMAGES: True
CACHE_SIZE_GIB: 8
NUM_EPOCHS: 200
BATCH_SIZE: 32
NUM_WORKERS: 14
DROP_LAST: True
AMP: True
RANDOM_SEED: 42
LOSS: l1
OPTIMIZER: adam
HEAD_LR: 1e-3
BACKBONE_LR: 1e-3
LAYER_DECAY: 0.75
WEIGHT_DECAY: 0
WARMUP_EPOCHS: 0
SCHEDULER: none
FLIP_AUG: False
GRAD_CLIP: 0

[Preprocessing]
CROP_TO_BBOX: True
MASKING_TYPE: rgb

[Model]
MODEL_BACKEND: mobilenet_v2
FREEZE_BACKEND: False
MODEL_SIZE: small
MODEL_INPUT_PLANE: False
MODEL_INPUT_BBOX: True
NORMALIZE_BBOX: True

[Augmentation]
AUGMENT_COLOR_TRAIN_IMAGES: True
AUGMENT_CROP_TRAIN_IMAGES: False
