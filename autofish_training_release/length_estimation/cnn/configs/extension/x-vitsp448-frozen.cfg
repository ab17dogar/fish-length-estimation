# Extension study config (train with ../train_vfm.py, NOT train.py).
# x-vitsp-frozen: encoder=dinov2_vits14-clspatch, regime=frozen.
[Config]
OUTPUT_DIR: ./output/x-vitsp448-frozen/
MASKS_GT: /workspace/autofish_dataset/annotations.json
TRAIN_GROUPS: [2, 3, 4, 5, 7, 8, 9, 12, 13, 15, 16, 18, 19, 23, 24]
VAL_GROUPS: [1, 6, 11, 17, 25]
TEST_GROUPS: [10, 14, 20, 21, 22]

[Training]
CACHE_IMAGES: True
CACHE_SIZE_GIB: 32
NUM_EPOCHS: 150
BATCH_SIZE: 8
NUM_WORKERS: 7
DROP_LAST: False
AMP: False
RANDOM_SEED: 42
LOSS: l1
OPTIMIZER: adamw
HEAD_LR: 1e-3
BACKBONE_LR: 0
LAYER_DECAY: 0.75
WEIGHT_DECAY: 0.05
WARMUP_EPOCHS: 5
SCHEDULER: cosine
FLIP_AUG: True
GRAD_CLIP: 1.0

[Preprocessing]
CROP_TO_BBOX: True
MASKING_TYPE: rgb
RESIZE_TO: 448

[Model]
MODEL_BACKEND: dinov2_vits14-clspatch
FREEZE_BACKEND: True
MODEL_SIZE: small
MODEL_INPUT_PLANE: False
MODEL_INPUT_BBOX: True
NORMALIZE_BBOX: True

[Augmentation]
AUGMENT_COLOR_TRAIN_IMAGES: True
AUGMENT_CROP_TRAIN_IMAGES: False
